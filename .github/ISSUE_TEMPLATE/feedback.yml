name: Ошибка или предложение
description: Сообщить об ошибке, вылете игры или предложить идею
body:
  - type: dropdown
    id: kind
    attributes:
      label: Что случилось
      options:
        - Ошибка
        - Вылет игры
        - Предложение
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Описание
      description: Что произошло и чего вы ждали. Если это предложение, опишите, что хотелось бы видеть в моде.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как повторить
      description: Что делали перед ошибкой. Если она повторяется, напишите шаги.
      placeholder: |
        1. Хост создал сервер из сохранения.
        2. Друг подключился по коду.
        3. Хост встал в маркер миссии, и у друга завис экран.
  - type: dropdown
    id: who
    attributes:
      label: У кого
      options:
        - У хоста
        - У напарника
        - У обоих
  - type: input
    id: version
    attributes:
      label: Версия мода
      description: Она написана в окне F9 справа вверху.
      placeholder: 0.1.0
  - type: dropdown
    id: game
    attributes:
      label: Игра
      options:
        - Чистая 1.0 US
        - Сборка с модами
  - type: textarea
    id: logs
    attributes:
      label: Логи
      description: >-
        Перетащите сюда файл `coop\coop.log` из папки игры того, у кого случилась ошибка. Если игра вылетела, нужен
        ещё `coop\crash.log`, а если не получается подключиться, то `coop\server-data\server.log` хоста.
